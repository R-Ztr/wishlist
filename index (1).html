<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma wishlist</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎁</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f2f0f8; --card:#ffffff; --ink:#1b1530; --muted:#6c6784; --line:#e0dcef;
  --accent:#5b3df5; --accent-ink:#ffffff; --soft:#e9e4ff; --ok:#1f9d6b;
  --font:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14101f; --card:#1e1930; --ink:#f1eefc; --muted:#a29cbf; --line:#2e2748; --accent:#8d76ff; --accent-ink:#14101f; --soft:#2a2250; --ok:#4cd6a0}
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 90px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:26px}
h1{margin:0;font-size:clamp(2rem,6vw,3.2rem);font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted);margin:6px 0 0}
.total{text-align:right}
.total b{display:block;font-size:clamp(2rem,6vw,3rem);font-weight:800;letter-spacing:-.03em;line-height:1;color:var(--accent)}
.total span{color:var(--muted);font-size:.92rem}

.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:8px 14px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip strong{display:block;font-weight:600;font-size:.95rem}
.chip small{opacity:.75;font-size:.8rem}

.tools{display:flex;flex-wrap:wrap;gap:10px;margin:6px 0 22px;align-items:center}
.tools input[type=search],.tools select{background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:9px 12px}
.tools input[type=search]{flex:1 1 200px;min-width:0}
.tools label.chk{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:.92rem;cursor:pointer}
.ghost{background:none;border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--ink)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.card.done{opacity:.55}
.card.done h3{text-decoration:line-through}
.thumb{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;overflow:hidden;position:relative}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb img.fav{width:56px;height:56px;object-fit:contain;border-radius:12px}
.thumb .ph{font-size:2.4rem}
.tag{position:absolute;left:10px;top:10px;background:var(--card);color:var(--ink);border-radius:999px;padding:3px 10px;font-size:.78rem;font-weight:600}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:1.08rem;line-height:1.25;font-weight:600}
.body p{margin:0;color:var(--muted);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.price{font-weight:800;font-size:1.2rem;letter-spacing:-.02em}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto;padding-top:10px}
.acts{display:flex;gap:4px}
.icon{background:none;border:none;border-radius:10px;padding:6px 8px;cursor:pointer;color:var(--muted)}
.icon:hover{background:var(--soft);color:var(--ink)}
.link{font-size:.85rem;color:var(--accent);text-decoration:none;font-weight:600}
.link:hover{text-decoration:underline}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted);border:2px dashed var(--line);border-radius:18px}

.fab{position:fixed;right:20px;bottom:20px;background:var(--accent);color:var(--accent-ink);border:none;border-radius:999px;padding:14px 22px;font-weight:600;font-size:1rem;cursor:pointer;box-shadow:0 8px 24px rgba(91,61,245,.35)}
.fab:hover{filter:brightness(1.08)}

dialog{border:none;border-radius:22px;padding:0;width:min(520px,calc(100% - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(20,16,31,.55)}
form{padding:22px;display:grid;gap:14px}
form h2{margin:0;font-size:1.35rem}
label.f{display:grid;gap:5px;font-size:.88rem;color:var(--muted);font-weight:600}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--ink);font-weight:400;width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--muted);min-height:20px}
.prev img{width:56px;height:56px;border-radius:10px;object-fit:cover}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.primary{background:var(--accent);color:var(--accent-ink);border:none;border-radius:12px;padding:10px 20px;font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media (max-width:520px){.two{grid-template-columns:1fr}.total{text-align:left}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Ma wishlist</h1>
      <p class="sub" id="sub"></p>
    </div>
    <div class="total"><b id="total">0 €</b><span id="totalLabel">à acheter</span></div>
  </header>

  <nav class="chips" id="chips" aria-label="Catégories"></nav>

  <div class="tools">
    <input type="search" id="q" placeholder="Rechercher…" aria-label="Rechercher">
    <select id="sort" aria-label="Trier">
      <option value="new">Plus récents</option>
      <option value="old">Plus anciens</option>
      <option value="asc">Prix croissant</option>
      <option value="desc">Prix décroissant</option>
      <option value="az">Nom A–Z</option>
    </select>
    <label class="chk"><input type="checkbox" id="hideDone"> Masquer les achetés</label>
    <button class="ghost" id="exp" title="Télécharger une sauvegarde">Exporter</button>
    <button class="ghost" id="imp" title="Restaurer une sauvegarde">Importer</button>
    <input type="file" id="file" accept="application/json" hidden>
  </div>

  <main class="grid" id="grid"></main>
</div>

<button class="fab" id="add">+ Ajouter</button>
<div class="toast" id="toast" role="status"></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dTitle">Nouvel article</h2>
    <label class="f">Lien du produit (optionnel)
      <input type="url" id="fUrl" placeholder="https://…">
    </label>
    <div class="prev" id="prev"></div>
    <label class="f">Nom
      <input type="text" id="fTitle" required maxlength="140" placeholder="Ex : Sneakers blanches">
    </label>
    <div class="two">
      <label class="f">Catégorie
        <select id="fCat"></select>
      </label>
      <label class="f">Prix (€)
        <input type="number" id="fPrice" min="0" step="0.01" inputmode="decimal" placeholder="0">
      </label>
    </div>
    <label class="f">Image (URL, optionnel)
      <input type="url" id="fImg" placeholder="Remplie automatiquement depuis le lien">
    </label>
    <label class="f">Note
      <textarea id="fNote" rows="3" placeholder="Taille, couleur, idée cadeau…"></textarea>
    </label>
    <div class="btns">
      <button type="button" class="ghost" id="newCat">Nouvelle catégorie</button>
      <button type="button" class="ghost" id="cancel">Annuler</button>
      <button type="submit" class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>

<script>
const KEY = "wishlist.v1";
const DEFAULT_CATS = ["Vêtements", "Parfums", "Accessoires", "Tech", "Maison", "Autre"];
const eur = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 2 });
const $ = (id) => document.getElementById(id);

let state = { items: [], cats: [...DEFAULT_CATS] };
let filter = "all";
let editId = null;

try {
  const raw = localStorage.getItem(KEY);
  if (raw) state = Object.assign(state, JSON.parse(raw));
} catch (e) {}

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
}
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 2200);
}

/* ---------- Rendu ---------- */
function visibleItems() {
  const q = $("q").value.trim().toLowerCase();
  let list = state.items.filter((i) =>
    (filter === "all" || i.cat === filter) &&
    (!$("hideDone").checked || !i.done) &&
    (!q || (i.title + " " + (i.note || "") + " " + i.cat + " " + host(i.url)).toLowerCase().includes(q))
  );
  const s = $("sort").value;
  const p = (i) => Number(i.price) || 0;
  list.sort((a, b) =>
    s === "old" ? a.ts - b.ts :
    s === "asc" ? p(a) - p(b) :
    s === "desc" ? p(b) - p(a) :
    s === "az" ? a.title.localeCompare(b.title, "fr") :
    b.ts - a.ts);
  return list;
}

function renderChips() {
  const sum = (arr) => arr.filter((i) => !i.done).reduce((t, i) => t + (Number(i.price) || 0), 0);
  const all = [{ key: "all", label: "Tout", items: state.items }].concat(
    state.cats.map((c) => ({ key: c, label: c, items: state.items.filter((i) => i.cat === c) })));
  $("chips").innerHTML = all.map((c) =>
    `<button class="chip" data-k="${esc(c.key)}" aria-pressed="${filter === c.key}">
       <strong>${esc(c.label)}</strong><small>${c.items.length} · ${eur.format(sum(c.items))}</small>
     </button>`).join("");
}

function thumb(i) {
  const tag = `<span class="tag">${esc(i.cat)}</span>`;
  if (i.img) return `<div class="thumb">${tag}<img src="${esc(i.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.innerHTML='${tag.replace(/'/g, "&#39;")}<span class=ph>🎁</span>'"></div>`;
  const h = host(i.url);
  if (h) return `<div class="thumb">${tag}<img class="fav" src="https://www.google.com/s2/favicons?domain=${esc(h)}&sz=128" alt=""></div>`;
  return `<div class="thumb">${tag}<span class="ph">🎁</span></div>`;
}

function render() {
  renderChips();
  const list = visibleItems();
  const todo = list.filter((i) => !i.done);
  const total = todo.reduce((t, i) => t + (Number(i.price) || 0), 0);
  $("total").textContent = eur.format(total);
  $("totalLabel").textContent = filter === "all" ? "à acheter au total" : "à acheter · " + filter;
  const n = state.items.length, d = state.items.filter((i) => i.done).length;
  $("sub").textContent = n ? `${n} article${n > 1 ? "s" : ""} · ${d} acheté${d > 1 ? "s" : ""}` : "Rien pour l’instant.";

  $("grid").innerHTML = list.length ? list.map((i) => `
    <article class="card ${i.done ? "done" : ""}" data-id="${i.id}">
      ${thumb(i)}
      <div class="body">
        <h3>${esc(i.title)}</h3>
        ${i.price ? `<span class="price">${eur.format(i.price)}</span>` : ""}
        ${i.note ? `<p>${esc(i.note)}</p>` : ""}
        <div class="row">
          ${i.url ? `<a class="link" href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">${esc(host(i.url))}</a>` : "<span></span>"}
          <div class="acts">
            <button class="icon" data-a="done" title="${i.done ? "Remettre à acheter" : "Marquer comme acheté"}">${i.done ? "↩" : "✓"}</button>
            <button class="icon" data-a="edit" title="Modifier">✎</button>
            <button class="icon" data-a="del" title="Supprimer">🗑</button>
          </div>
        </div>
      </div>
    </article>`).join("")
    : `<div class="empty"><p><strong>${n ? "Aucun résultat" : "Ta wishlist est vide"}</strong></p><p>${n ? "Change de catégorie ou de recherche." : "Appuie sur « Ajouter » pour coller un lien ou écrire une idée."}</p></div>`;
}

/* ---------- Formulaire ---------- */
function fillCats(sel) {
  $("fCat").innerHTML = state.cats.map((c) => `<option ${c === sel ? "selected" : ""}>${esc(c)}</option>`).join("");
}
function openForm(item) {
  editId = item ? item.id : null;
  $("dTitle").textContent = item ? "Modifier l’article" : "Nouvel article";
  $("fUrl").value = item?.url || "";
  $("fTitle").value = item?.title || "";
  $("fPrice").value = item?.price || "";
  $("fImg").value = item?.img || "";
  $("fNote").value = item?.note || "";
  $("prev").innerHTML = "";
  fillCats(item?.cat || (filter !== "all" ? filter : state.cats[0]));
  $("dlg").showModal();
  $(item ? "fTitle" : "fUrl").focus();
}

let fetchToken = 0;
async function previewLink() {
  const u = $("fUrl").value.trim();
  if (!/^https?:\/\//i.test(u)) { $("prev").innerHTML = ""; return; }
  const tok = ++fetchToken;
  $("prev").textContent = "Récupération de l’aperçu…";
  try {
    const r = await fetch("https://api.microlink.io/?url=" + encodeURIComponent(u));
    const j = await r.json();
    if (tok !== fetchToken) return;
    const d = j.data || {};
    const img = d.image?.url || d.logo?.url || "";
    if (img && !$("fImg").value) $("fImg").value = img;
    if (d.title && !$("fTitle").value) $("fTitle").value = d.title.slice(0, 140);
    $("prev").innerHTML = (img ? `<img src="${esc(img)}" alt="" referrerpolicy="no-referrer">` : "") +
      `<span>${esc(d.publisher || host(u))}${d.title ? " — " + esc(d.title.slice(0, 70)) : ""}</span>`;
  } catch (e) {
    if (tok === fetchToken) $("prev").textContent = "Aperçu indisponible. Tu peux coller une image à la main.";
  }
}

$("fUrl").addEventListener("change", previewLink);
$("fUrl").addEventListener("paste", () => setTimeout(previewLink, 50));
$("cancel").onclick = () => $("dlg").close();
$("add").onclick = () => openForm(null);
$("newCat").onclick = () => {
  const n = (prompt("Nom de la nouvelle catégorie ?") || "").trim();
  if (!n) return;
  if (!state.cats.some((c) => c.toLowerCase() === n.toLowerCase())) state.cats.push(n);
  fillCats(n); $("fCat").value = n; save();
};
$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const data = {
    title: $("fTitle").value.trim(),
    cat: $("fCat").value,
    price: parseFloat($("fPrice").value) || 0,
    url: $("fUrl").value.trim(),
    img: $("fImg").value.trim(),
    note: $("fNote").value.trim(),
  };
  if (!data.title) return;
  if (editId) Object.assign(state.items.find((i) => i.id === editId), data);
  else state.items.push({ id: crypto.randomUUID(), ts: Date.now(), done: false, ...data });
  save(); render(); $("dlg").close();
  toast(editId ? "Article modifié" : "Article ajouté");
});

/* ---------- Interactions ---------- */
$("chips").addEventListener("click", (e) => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.k; render();
});
$("grid").addEventListener("click", (e) => {
  const b = e.target.closest("[data-a]"); if (!b) return;
  const id = b.closest(".card").dataset.id;
  const it = state.items.find((i) => i.id === id);
  if (b.dataset.a === "edit") return openForm(it);
  if (b.dataset.a === "done") { it.done = !it.done; }
  if (b.dataset.a === "del") {
    if (!confirm("Supprimer « " + it.title + " » ?")) return;
    state.items = state.items.filter((i) => i.id !== id);
  }
  save(); render();
});
["q", "sort", "hideDone"].forEach((id) => $(id).addEventListener("input", render));

$("exp").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  a.download = "wishlist-" + new Date().toISOString().slice(0, 10) + ".json";
  a.click(); URL.revokeObjectURL(a.href);
};
$("imp").onclick = () => $("file").click();
$("file").onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.items) || !Array.isArray(d.cats)) throw 0;
    state = d; filter = "all"; save(); render(); toast("Sauvegarde restaurée");
  } catch (err) { toast("Fichier invalide"); }
  e.target.value = "";
};

render();
</script>
</body>
</html>
